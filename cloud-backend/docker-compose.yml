# Local dev: `docker compose up`
# On your Unraid box: this same file is what you'd paste into a Dockge stack.
#
# Required environment variables (put these in a `.env` file next to this
# compose file — see .env.example — never commit real values):
#   POSTGRES_PASSWORD  — Postgres password
#   JWT_SECRET          — random secret for signing auth tokens (openssl rand -hex 32)
#   GROQ_API_KEY         — optional, AI features are disabled without it

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relationship_graph_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/relationship_graph_cloud
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  db_data:
