name: build

on:
  push:
    tags:
      - "v*"

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend binary
        working-directory: backend
        run: pyinstaller backend.spec --clean --noconfirm

      # Tauri's sidecar loader requires the binary name to end in the exact
      # Rust target triple it was built for. Note: backend.spec names the
      # PyInstaller output "rg-server", not "server" — this rename step
      # must match that.
      - name: Rename binary to match Tauri sidecar naming convention
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          mv "backend/dist/rg-server${{ matrix.bin_ext }}" \
             "src-tauri/binaries/relationship-graph-backend-${{ matrix.target }}${{ matrix.bin_ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: src-tauri/binaries/*

  build-tauri:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: src-tauri/binaries

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - uses: dtolnay/rust-toolchain@stable

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Relationship Graph ${{ github.ref_name }}"
          releaseBody: |
            ## Relationship Graph ${{ github.ref_name }}

            ### Downloads
            - **Windows** — download the `.msi` installer below
            - **Mac** — download the `.dmg` below

            ### Installation
            **Windows:** Run the installer and follow the prompts.
            **Mac:** Open the `.dmg`, drag the app to your Applications folder. If you see a "damaged" error, run `xattr -cr "/Applications/Relationship Graph.app"` in Terminal.

            ### Notes
            - Your data is stored locally — no account needed
            - Works fully offline (AI suggestions require a Groq API key)
          releaseDraft: true
          prerelease: false
